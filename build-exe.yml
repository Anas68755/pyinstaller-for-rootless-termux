name: Build Windows EXE

on:
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:
    inputs:
      entry_script:
        description: 'Path to the Python script to build (e.g. main.py)'
        required: false
        default: 'main.py'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Determine entry script
        id: entry
        shell: bash
        run: |
          SCRIPT="${{ github.event.inputs.entry_script }}"
          if [ -z "$SCRIPT" ]; then
            SCRIPT="main.py"
          fi
          if [ ! -f "$SCRIPT" ]; then
            echo "Entry script '$SCRIPT' not found in repo root."
            echo "Set it via workflow_dispatch input 'entry_script', or add main.py."
            exit 1
          fi
          echo "script=$SCRIPT" >> "$GITHUB_OUTPUT"

      - name: Build EXE with PyInstaller
        shell: bash
        run: |
          pyinstaller --onefile --noconfirm "${{ steps.entry.outputs.script }}"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
          if-no-files-found: error
